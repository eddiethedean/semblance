name: Release

on:
  push:
    tags:
      - "v[0-9]*"
      - "foundry-v[0-9]*"
      - "databricks-v[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ruff==0.16.3

      - name: Ruff check
        run: ruff check src tests packages/semblance-foundry packages/semblance-databricks

      - name: Ruff format
        run: ruff format --check src tests packages/semblance-foundry packages/semblance-databricks

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-release-${{ hashFiles('pyproject.toml') }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
          pip install -e "packages/semblance-foundry[dev]"
          pip install -e "packages/semblance-databricks[dev]"

      - name: Mypy
        run: mypy src packages/semblance-foundry/src packages/semblance-databricks/src

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-release-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
          pip install -e "packages/semblance-foundry[dev]"
          pip install -e "packages/semblance-databricks[dev]"

      - name: Run tests
        run: pytest tests/ packages/semblance-foundry/tests packages/semblance-databricks/tests -v --cov=src/semblance --cov-report=xml -m "not sdk"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-release-security-${{ hashFiles('pyproject.toml') }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
          pip install -e "packages/semblance-foundry[dev]"
          pip install -e "packages/semblance-databricks[dev]"

      - name: Bandit
        run: bandit -r src/ packages/semblance-foundry/src packages/semblance-databricks/src -ll

      - name: pip-audit
        run: pip-audit

  build-and-publish:
    if: startsWith(github.ref_name, 'v')
    needs: [lint, typecheck, test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches semblance version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG pyproject=$VERSION"
          test "$TAG" = "$VERSION"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-release-${{ hashFiles('pyproject.toml') }}

      - name: Install build
        run: |
          python -m pip install --upgrade pip setuptools
          pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          username: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-publish-foundry:
    if: startsWith(github.ref_name, 'foundry-v')
    needs: [lint, typecheck, test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches semblance-foundry version
        run: |
          TAG="${GITHUB_REF_NAME#foundry-v}"
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('packages/semblance-foundry/pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG pyproject=$VERSION"
          test "$TAG" = "$VERSION"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-release-foundry-${{ hashFiles('packages/semblance-foundry/pyproject.toml') }}

      - name: Install build
        run: |
          python -m pip install --upgrade pip setuptools
          pip install build

      - name: Build package
        run: python -m build packages/semblance-foundry

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/semblance-foundry/dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: packages/semblance-foundry/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-publish-databricks:
    if: startsWith(github.ref_name, 'databricks-v')
    needs: [lint, typecheck, test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches semblance-databricks version
        run: |
          TAG="${GITHUB_REF_NAME#databricks-v}"
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('packages/semblance-databricks/pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG pyproject=$VERSION"
          test "$TAG" = "$VERSION"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-release-databricks-${{ hashFiles('packages/semblance-databricks/pyproject.toml') }}

      - name: Install build
        run: |
          python -m pip install --upgrade pip setuptools
          pip install build

      - name: Build package
        run: python -m build packages/semblance-databricks

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/semblance-databricks/dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: packages/semblance-databricks/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
