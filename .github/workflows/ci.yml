name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ruff==0.16.3

      - name: Ruff check
        run: ruff check src tests packages/semblance-foundry packages/semblance-databricks

      - name: Ruff format
        run: ruff format --check src tests packages/semblance-foundry packages/semblance-databricks

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: pip install -e ".[docs]"

      - name: Build documentation
        run: python -m mkdocs build --strict

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'packages/semblance-foundry/pyproject.toml', 'packages/semblance-databricks/pyproject.toml') }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
          pip install -e "packages/semblance-foundry[dev]"
          pip install -e "packages/semblance-databricks[dev]"

      - name: Mypy
        run: mypy src packages/semblance-foundry/src packages/semblance-databricks/src

  typing-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package wheels
        run: |
          python -m pip install --upgrade pip build
          mkdir -p "$RUNNER_TEMP/semblance-wheels/core" "$RUNNER_TEMP/semblance-wheels/foundry" "$RUNNER_TEMP/semblance-wheels/databricks"
          python -m build --outdir "$RUNNER_TEMP/semblance-wheels/core" .
          python -m build --outdir "$RUNNER_TEMP/semblance-wheels/foundry" packages/semblance-foundry
          python -m build --outdir "$RUNNER_TEMP/semblance-wheels/databricks" packages/semblance-databricks

      - name: Check package metadata and typing markers
        run: python scripts/check_package_artifacts.py "$RUNNER_TEMP/semblance-wheels"

      - name: Install wheels and type checker
        run: |
          python -m pip install mypy \
            "$RUNNER_TEMP"/semblance-wheels/core/*.whl \
            "$RUNNER_TEMP"/semblance-wheels/foundry/*.whl \
            "$RUNNER_TEMP"/semblance-wheels/databricks/*.whl

      - name: Check installed public API types
        run: |
          printf '[mypy]\n' > "$RUNNER_TEMP/mypy-consumer.ini"
          cd "$RUNNER_TEMP"
          python -m mypy --strict --config-file "$RUNNER_TEMP/mypy-consumer.ini" \
            "$GITHUB_WORKSPACE/tests/typing/public_api.py"

      - name: Smoke test installed packages and CLIs
        run: |
          cd "$RUNNER_TEMP"
          python -c "import semblance, semblance_foundry, semblance_databricks"
          python -c "from fastapi import FastAPI; from semblance.export import export_openapi; assert export_openapi(FastAPI())['paths'] == {}"
          semblance --help
          semblance-foundry --help
          semblance-databricks --help

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        package: [core, foundry, databricks]
        include:
          - package: core
            pytest-args: tests/ --cov=src/semblance
          - package: foundry
            pytest-args: packages/semblance-foundry/tests --cov=packages/semblance-foundry/src/semblance_foundry
          - package: databricks
            pytest-args: packages/semblance-databricks/tests --cov=packages/semblance-databricks/src/semblance_databricks

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'packages/semblance-foundry/pyproject.toml', 'packages/semblance-databricks/pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
          pip install -e "packages/semblance-foundry[dev]"
          pip install -e "packages/semblance-databricks[dev]"

      - name: Run tests (${{ matrix.package }})
        shell: bash
        run: pytest ${{ matrix.pytest-args }} -v --cov-report=xml -m "not sdk"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-security-${{ hashFiles('pyproject.toml', 'packages/semblance-foundry/pyproject.toml', 'packages/semblance-databricks/pyproject.toml') }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
          pip install -e "packages/semblance-foundry[dev]"
          pip install -e "packages/semblance-databricks[dev]"

      - name: Bandit
        run: bandit -r src/ packages/semblance-foundry/src packages/semblance-databricks/src -ll

      - name: pip-audit
        run: pip-audit
